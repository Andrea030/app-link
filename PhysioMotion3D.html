<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PhysioMotion 3D — Movimiento & Rehabilitación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root[data-theme="dark"] {
    --bg: #070B1E;
    --bg-grad: radial-gradient(circle at 50% 0%, #132257 0%, #070B1E 70%);
    --surface: #10193E;
    --surface2: #192558;
    --ink: #F0F4FF;
    --muted: #9BA8D9;
    --line: #26387A;
    --accent: #00E5FF;
    --accent-ink: #04122C;
    --purple: #6C4DFF;
    --purple-ink: #FFFFFF;
    --teal: #18E0C8;
    --teal-soft: rgba(24, 224, 200, 0.14);
    --warn: #FFB46E;
    --warn-soft: rgba(255, 180, 110, 0.15);
    --danger: #FF7B72;
    --danger-soft: rgba(255, 123, 114, 0.16);
    --ok: #5CE69B;
    --ok-soft: rgba(92, 230, 155, 0.15);
    --fig: #7E8CE0;
    --hl: #FF4D4D;
    color-scheme: dark;
    }

    :root[data-theme="light"] {
    --bg: #F3F4FB;
    --bg-grad: linear-gradient(180deg, #ECE9FC 0%, #F3F4FB 100%);
    --surface: #FFFFFF;
    --surface2: #E6E4F7;
    --ink: #17133B;
    --muted: #585482;
    --line: #D4D0EE;
    --accent: #008B9E;
    --accent-ink: #FFFFFF;
    --purple: #5B3FD0;
    --purple-ink: #FFFFFF;
    --teal: #0B8F85;
    --teal-soft: #D6F3F0;
    --warn: #9A3A08;
    --warn-soft: #FFE9DB;
    --danger: #A8231B;
    --danger-soft: #FDE4E1;
    --ok: #12713F;
    --ok-soft: #DDF5E7;
    --fig: #7B70D8;
    --hl: #D93832;
    color-scheme: light;
    }

    :root {
    --fs: 16px;
    --font-d: "Fredoka", "Nunito", system-ui, sans-serif;
    --font-b: "Nunito", system-ui, -apple-system, sans-serif;
    }

    * {
    box-sizing: border-box;
    }

    html {
    font-size: var(--fs);
    -webkit-text-size-adjust: 100%;
    }

    body {
    margin: 0;
    background: var(--bg);
    background-image: var(--bg-grad);
    background-attachment: fixed;
    color: var(--ink);
    font-family: var(--font-b);
    line-height: 1.45;
    padding-left: max(14px, env(safe-area-inset-left, 0px));
    padding-right: max(14px, env(safe-area-inset-right, 0px));
    }

    button, input, select, textarea {
    font: inherit;
    color: inherit;
    }

    h1, h2, h3, h4 {
    font-family: var(--font-d);
    font-weight: 600;
    margin: 0;
    line-height: 1.2;
    }

    h1 { font-size: 1.55rem; }
    h2 { font-size: 1.2rem; }
    h3 { font-size: 1.05rem; }
    p { margin: 0; }

    .app-shell {
    max-width: 540px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    }

    @media (min-width: 860px) {
    .app-shell {
        max-width: 780px;
    }
    }

    .topbar {
    position: sticky;
    top: 0;
    z-index: 15;
    background: rgba(16, 25, 62, 0.88);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 6px;
    margin: 0 -6px 12px;
    }

    :root[data-theme="light"] .topbar {
    background: rgba(255, 255, 255, 0.9);
    }

    .topbar h1 {
    flex: 1;
    font-size: 1.18rem;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    }

    .iconbtn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 12px;
    min-width: 42px;
    height: 42px;
    display: inline-grid;
    place-items: center;
    cursor: pointer;
    padding: 0 10px;
    font-weight: 800;
    transition: transform 0.12s ease, border-color 0.15s ease;
    }

    .iconbtn:hover {
    border-color: var(--accent);
    }

    .iconbtn:active {
    transform: scale(0.96);
    }

    .view {
    display: flex;
    flex-direction: column;
    gap: 14px;
    }

    .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 15px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
    }

    .card.flat {
    background: var(--surface2);
    border-color: transparent;
    box-shadow: none;
    }

    .card.neon {
    border-color: var(--accent);
    box-shadow: 0 0 18px rgba(0, 229, 255, 0.15);
    }

    .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 48px;
    padding: 0 18px;
    border-radius: 14px;
    border: 2px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 800;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: transform 0.12s ease, opacity 0.15s ease;
    }

    .btn:active {
    transform: scale(0.98);
    }

    .btn.purple {
    background: var(--purple);
    border-color: var(--purple);
    color: var(--purple-ink);
    }

    .btn.alt {
    background: transparent;
    color: var(--accent);
    border-color: var(--accent);
    }

    .btn.ghost {
    background: var(--surface2);
    border-color: var(--line);
    color: var(--ink);
    }

    .btn.danger {
    background: transparent;
    color: var(--danger);
    border-color: var(--danger);
    }

    .btn.sm {
    min-height: 38px;
    padding: 0 12px;
    font-size: 0.86rem;
    border-radius: 10px;
    }

    .btn.block {
    width: 100%;
    }

    .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    }

    .row {
    display: flex;
    gap: 10px;
    align-items: center;
    }

    .row.wrap {
    flex-wrap: wrap;
    }

    .spread {
    justify-content: space-between;
    }

    .muted {
    color: var(--muted);
    }

    .small {
    font-size: 0.85rem;
    }

    .chips {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    }

    .chip {
    border: 1.5px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    border-radius: 999px;
    padding: 6px 13px;
    min-height: 36px;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    }

    .chip.on {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    }

    .chip.static {
    cursor: default;
    }

    .tag {
    font-size: 0.72rem;
    font-weight: 800;
    border-radius: 8px;
    padding: 3px 8px;
    background: var(--surface2);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    display: inline-block;
    }

    .tag.teal {
    background: var(--teal-soft);
    color: var(--teal);
    }

    .tag.warn {
    background: var(--warn-soft);
    color: var(--warn);
    }

    .hero {
    background: linear-gradient(135deg, #5B3FD0 0%, #0097B2 100%);
    color: #FFFFFF;
    border-radius: 22px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 1px solid rgba(0, 229, 255, 0.35);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
    }

    .grid2 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    }

    .grid4 {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    }

    @media (min-width: 520px) {
    .grid4 {
        grid-template-columns: repeat(4, 1fr);
    }
    }

    .tile {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: left;
    cursor: pointer;
    min-height: 98px;
    transition: border-color 0.15s ease, transform 0.12s ease;
    }

    .tile:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    }

    .tile .ico {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: var(--teal-soft);
    color: var(--teal);
    }

    .list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    }

    .item {
    display: flex;
    gap: 12px;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 15px;
    padding: 12px;
    cursor: pointer;
    text-align: left;
    width: 100%;
    transition: border-color 0.15s ease;
    }

    .item:hover {
    border-color: var(--accent);
    }

    .item .grow {
    flex: 1;
    min-width: 0;
    }

    .item .ico {
    flex: none;
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: var(--surface2);
    display: grid;
    place-items: center;
    color: var(--accent);
    }

    .item .nm {
    font-weight: 800;
    }

    .search {
    width: 100%;
    min-height: 48px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    padding: 0 14px;
    }

    label.f {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-weight: 700;
    font-size: 0.9rem;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"],
    input[type="number"],
    select,
    textarea {
    width: 100%;
    min-height: 46px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: var(--surface);
    padding: 8px 12px;
    }

    textarea {
    min-height: 86px;
    resize: vertical;
    }

    input[type="range"] {
    width: 100%;
    accent-color: var(--accent);
    min-height: 34px;
    }

    .stage {
    position: relative;
    background: var(--surface);
    border: 1.5px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
    }

    .stage canvas {
    display: block;
    width: 100%;
    height: 290px;
    touch-action: pan-y;
    cursor: grab;
    }

    .stage .hud-top {
    position: absolute;
    left: 10px;
    right: 10px;
    top: 10px;
    display: flex;
    justify-content: space-between;
    gap: 6px;
    pointer-events: none;
    flex-wrap: wrap;
    }

    .stage .badge3d {
    font-size: 0.74rem;
    font-weight: 800;
    color: var(--ink);
    background: rgba(16, 25, 62, 0.82);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 4px 9px;
    }

    :root[data-theme="light"] .stage .badge3d {
    background: rgba(255, 255, 255, 0.88);
    }

    .stage .bar {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 9px;
    border-top: 1px solid var(--line);
    background: var(--surface);
    justify-content: center;
    }

    .tabs {
    display: flex;
    gap: 4px;
    background: var(--surface2);
    border-radius: 14px;
    padding: 4px;
    overflow-x: auto;
    }

    .tabs button {
    flex: 1;
    min-height: 40px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font-weight: 800;
    cursor: pointer;
    font-size: 0.82rem;
    padding: 0 8px;
    white-space: nowrap;
    }

    .tabs button.on {
    background: var(--surface);
    color: var(--accent);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }

    .tabbar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 25;
    background: var(--surface);
    border-top: 1px solid var(--line);
    padding: 6px max(8px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px));
    }

    .tabbar nav {
    max-width: 640px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    }

    .tabbar button {
    border: 0;
    background: transparent;
    color: var(--muted);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    min-height: 54px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 0.7rem;
    cursor: pointer;
    padding: 4px 2px;
    }

    .tabbar button.on {
    color: var(--accent);
    background: var(--surface2);
    }

    .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
    background: var(--surface2);
    border-radius: 14px;
    padding: 12px;
    }

    .stat b {
    font-family: var(--font-d);
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--accent);
    }

    .stat span {
    font-size: 0.78rem;
    color: var(--muted);
    font-weight: 700;
    }

    .alert {
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 0.9rem;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    }

    .alert.warn { background: var(--warn-soft); color: var(--warn); }
    .alert.danger { background: var(--danger-soft); color: var(--danger); }
    .alert.ok { background: var(--ok-soft); color: var(--ok); }
    .alert.info { background: var(--teal-soft); color: var(--ink); }

    .steps {
    margin: 0;
    padding-left: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 6px;
    }

    ul.dots {
    margin: 0;
    padding-left: 1.15rem;
    display: flex;
    flex-direction: column;
    gap: 5px;
    }

    .bodymap {
    display: grid;
    grid-template-columns: 145px 1fr;
    gap: 14px;
    align-items: center;
    }

    @media (max-width: 400px) {
    .bodymap {
        grid-template-columns: 1fr;
    }
    }

    .bodymap svg {
    width: 100%;
    max-height: 290px;
    }

    .bodymap .rg {
    fill: var(--surface2);
    stroke: var(--accent);
    stroke-width: 1;
    cursor: pointer;
    transition: fill 0.15s;
    }

    .bodymap .rg:hover,
    .bodymap .rg.on {
    fill: var(--hl);
    }

    .bodymap .hd {
    fill: var(--surface2);
    stroke: var(--line);
    }

    .ring {
    --p: 0;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface2) 0);
    display: grid;
    place-items: center;
    margin: 0 auto;
    }

    .ring > div {
    width: 148px;
    height: 148px;
    border-radius: 50%;
    background: var(--surface);
    display: grid;
    place-items: center;
    text-align: center;
    padding: 8px;
    }

    .ring b {
    font-family: var(--font-d);
    font-size: 2.35rem;
    line-height: 1;
    }

    .bars {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    height: 110px;
    }

    .bars div {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    height: 100%;
    font-size: 0.72rem;
    color: var(--muted);
    font-weight: 700;
    }

    .bars i {
    display: block;
    width: 100%;
    border-radius: 8px 8px 4px 4px;
    background: var(--accent);
    min-height: 4px;
    }

    .bars i.zero {
    background: var(--surface2);
    }

    .medal {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-align: center;
    padding: 10px 6px;
    border-radius: 14px;
    background: var(--surface2);
    font-size: 0.76rem;
    font-weight: 800;
    }

    .medal.off {
    opacity: 0.4;
    filter: grayscale(1);
    }

    .scancv {
    width: 100%;
    border-radius: 14px;
    touch-action: none;
    background: var(--surface2);
    display: block;
    }

    table.tb {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.86rem;
    }

    table.tb th, table.tb td {
    padding: 8px 6px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    }

    table.tb th {
    color: var(--muted);
    font-size: 0.74rem;
    text-transform: uppercase;
    }

    details.acc {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0 14px;
    }

    details.acc summary {
    min-height: 50px;
    display: flex;
    align-items: center;
    font-weight: 800;
    cursor: pointer;
    list-style: none;
    justify-content: space-between;
    gap: 8px;
    }

    details.acc summary::-webkit-details-marker {
    display: none;
    }

    details.acc[open] summary {
    border-bottom: 1px solid var(--line);
    margin-bottom: 10px;
    }

    details.acc > div {
    padding-bottom: 12px;
    }

    .check {
    display: flex;
    gap: 10px;
    align-items: center;
    min-height: 40px;
    cursor: pointer;
    }

    .check input {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    flex: none;
    }

    .avatar-box {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: var(--surface2);
    border: 2px solid var(--accent);
    display: grid;
    place-items: center;
    overflow: hidden;
    flex: none;
    }

    .avatar-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    }

    .toast {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(96px + env(safe-area-inset-bottom, 0px));
    background: var(--accent);
    color: var(--accent-ink);
    padding: 10px 18px;
    border-radius: 12px;
    font-weight: 800;
    z-index: 80;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
    }

    .auth-hero {
    text-align: center;
    padding: 28px 18px;
    border-radius: 24px;
    background: linear-gradient(160deg, #132257 0%, #09112E 100%);
    border: 1.5px solid var(--accent);
    box-shadow: 0 0 28px rgba(0, 229, 255, 0.16);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    }
  </style>
</head>

/* ===== AUDIO BEEPS PARA TEMPORIZADOR Y EJECUCIÓN ===== */
let audioCtx = null;
function beep(freq = 880, dur = 0.14) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.frequency.value = freq;
    gain.gain.value = 0.15;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + dur);
  } catch (e) {}
}

let IDB = null;
function openVideoDB() {
  return new Promise((resolve, reject) => {
    if (IDB) return resolve(IDB);
    const req = indexedDB.open("physiomotion3d_videos", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("videos", { keyPath: "id" });
    req.onsuccess = () => { IDB = req.result; resolve(IDB); };
    req.onerror = () => reject(req.error);
  });
}
async function getVideosByEx(exId) {
  try {
    const db = await openVideoDB();
    return await new Promise((res, rej) => {
      const r = db.transaction("videos").objectStore("videos").getAll();
      r.onsuccess = () => res((r.result || []).filter(v => v.ex === exId));
      r.onerror = () => rej();
    });
  } catch (e) { return []; }
}
async function saveVideoRecord(rec) {
  const db = await openVideoDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("videos", "readwrite");
    tx.objectStore("videos").put(rec);
    tx.oncomplete = () => res();
    tx.onerror = () => rej();
  });
}
async function deleteVideoRecord(id) {
  const db = await openVideoDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("videos", "readwrite");
    tx.objectStore("videos").delete(id);
    tx.oncomplete = () => res();
    tx.onerror = () => rej();
  });
}

/* ===== MOTOR 3D DE CINEMÁTICA DIRECTA Y RENDERIZADO DE FIBRAS MUSCULARES ===== */
const RAD = Math.PI / 180;
const PKEYS = ["tilt", "t", "Lh", "Lk", "Rh", "Rk", "Lab", "Rab", "Ls", "Le", "Rs", "Re", "Lsab", "Rsab", "rise", "air"];

function normPose(p) {
  const o = {};
  PKEYS.forEach(k => o[k] = 0);
  const set = (k, v) => { if (v !== undefined) o[k] = v; };
  set("tilt", p.tilt); set("t", p.t);
  set("Lh", p.h); set("Rh", p.h); set("Lk", p.k); set("Rk", p.k);
  set("Lh", p.Lh); set("Rh", p.Rh); set("Lk", p.Lk); set("Rk", p.Rk);
  set("Lab", p.ab); set("Rab", p.ab); set("Lab", p.Lab); set("Rab", p.Rab);
  set("Ls", p.s); set("Rs", p.s); set("Le", p.e); set("Re", p.e);
  set("Ls", p.Ls); set("Rs", p.Rs); set("Le", p.Le); set("Re", p.Re);
  set("Lsab", p.sab); set("Rsab", p.sab); set("Lsab", p.Lsab); set("Rsab", p.Rsab);
  set("rise", p.rise); set("air", p.air);
  return o;
}

function lerpPose(a, b, k) {
  const o = {};
  PKEYS.forEach(n => o[n] = a[n] + (b[n] - a[n]) * k);
  return o;
}

function fk(P) {
  const L1 = 0.45, L2 = 0.45, T = 0.55, U = 0.3, Fa = 0.27, hw = 0.1, sw = 0.2, foot = 0.22, h0 = 0.08;
  const th = P.tilt * RAD, ph = P.t * RAD;
  const rotZ = v => [v[0] * Math.cos(th) + v[1] * Math.sin(th), -v[0] * Math.sin(th) + v[1] * Math.cos(th), v[2]];
  const add = (a, b, l) => [a[0] + b[0] * l, a[1] + b[1] * l, a[2] + b[2] * l];
  const dirv = (ang, ab, side) => {
    const x = Math.sin(ang), y = -Math.cos(ang);
    const be = -side * ab * RAD;
    return [x, y * Math.cos(be), y * Math.sin(be)];
  };
  const pts = {};
  const pel = [0, 0, 0], neck = [T * Math.sin(ph), T * Math.cos(ph), 0], head = [(T + 0.2) * Math.sin(ph), (T + 0.2) * Math.cos(ph), 0];
  const hip = { L: [0, 0, hw], R: [0, 0, -hw] }, sh = { L: [neck[0], neck[1] - 0.03, sw], R: [neck[0], neck[1] - 0.03, -sw] };
  const side = { L: 1, R: -1 };
  ["L", "R"].forEach(S => {
    const a1 = P[S + "h"] * RAD, a2 = (P[S + "h"] - P[S + "k"]) * RAD, ab = P[S + "ab"];
    const knee = add(hip[S], dirv(a1, ab, side[S]), L1);
    const ank = add(knee, dirv(a2, ab, side[S]), L2);
    const g = Math.asin(Math.min(0.99, (h0 + P.rise) / foot));
    const toe = [ank[0] + foot * Math.cos(g), ank[1] - foot * Math.sin(g), ank[2]];
    const s1 = P[S + "s"] * RAD, s2 = (P[S + "s"] + P[S + "e"]) * RAD, sab = P[S + "sab"];
    const elb = add(sh[S], dirv(s1, sab, side[S]), U);
    const hand = add(elb, dirv(s2, sab, side[S]), Fa);
    pts["hip" + S] = hip[S]; pts["knee" + S] = knee; pts["ank" + S] = ank; pts["toe" + S] = toe;
    pts["sh" + S] = sh[S]; pts["elb" + S] = elb; pts["hand" + S] = hand;
  });
  pts.pel = pel; pts.neck = neck; pts.head = head; pts.mid = [neck[0] / 2, neck[1] / 2, 0];
  let minY = 1e9;
  for (const k in pts) pts[k] = rotZ(pts[k]);
  for (const k in pts) if (k !== "head") minY = Math.min(minY, pts[k][1]);
  for (const k in pts) pts[k][1] += -minY + P.air;
  return pts;
}

const SEGS = [
  ["torsoLow", "pel", "mid", 0.17], ["torsoUp", "mid", "neck", 0.2], ["pelvis", "hipL", "hipR", 0.15], ["shoulders", "shL", "shR", 0.11],
  ["thighL", "hipL", "kneeL", 0.12], ["shinL", "kneeL", "ankL", 0.085], ["thighR", "hipR", "kneeR", 0.12], ["shinR", "kneeR", "ankR", 0.085],
  ["uarmL", "shL", "elbL", 0.075], ["farmL", "elbL", "handL", 0.062], ["uarmR", "shR", "elbR", 0.075], ["farmR", "elbR", "handR", 0.062],
  ["footL", "ankL", "toeL", 0.05], ["footR", "ankR", "toeR", 0.05]
];

function parseCol(s) {
  s = (s || "").trim();
  let m = /^#([0-9a-f]{6})$/i.exec(s);
  if (m) return [0, 2, 4].map(i => parseInt(m[1].slice(i, i + 2), 16));
  return [126, 140, 224];
}
const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = c => `rgb(${c[0]},${c[1]},${c[2]})`;

let ACTIVE_VIEWER = null;
class Viewer3D {
  constructor(canvas, opts = {}) {
    this.c = canvas;
    this.ctx = canvas.getContext("2d");
    this.yaw = opts.yaw ?? 35;
    this.pitch = 12;
    this.auto = opts.auto ?? true;
    this.playing = true;
    this.speedMul = 1;
    this.tt = 0;
    this.last = performance.now();
    this.drag = null;
    this.modePose = "anim"; // anim, init, final
    const ro = new ResizeObserver(() => this.size());
    ro.observe(canvas);
    this.ro = ro;
    this.size();
    canvas.addEventListener("pointerdown", e => {
      this.drag = { x: e.clientX, yaw: this.yaw };
      this.auto = false;
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener("pointermove", e => {
      if (this.drag) this.yaw = this.drag.yaw + (e.clientX - this.drag.x) * 0.65;
    });
    const up = () => { this.drag = null; };
    canvas.addEventListener("pointerup", up);
    canvas.addEventListener("pointercancel", up);
    this.loop = this.loop.bind(this);
    requestAnimationFrame(this.loop);
  }
  size() {
    const d = Math.min(2, window.devicePixelRatio || 1);
    const w = this.c.clientWidth || 320, h = this.c.clientHeight || 280;
    this.c.width = w * d; this.c.height = h * d;
    this.dpr = d; this.w = w; this.h = h;
    if (this.A) this.fit();
  }
  setExercise(ex, hlSegs) {
    this.ex = ex;
    const p = ex.pose || { A: {}, B: {} };
    this.A = normPose(p.A || {});
    this.B = normPose(p.B || {});
    this.hold = p.hold ? 1 : 0;
    this.spd = p.spd || 0.4;
    this.chair = !!(p.chair || (p.A && p.A.chair) || (p.B && p.B.chair));
    this.hl = new Set(hlSegs || []);
    this.tt = 0;
    this.fit();
  }
  fit() {
    let minX = 1e9, maxX = -1e9, maxY = 0, zr = 0.25;
    [this.A, this.B, lerpPose(this.A, this.B, 0.5)].forEach(P => {
      const q = fk(P);
      for (const k in q) {
        const p = q[k];
        minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]);
        maxY = Math.max(maxY, p[1]); zr = Math.max(zr, Math.abs(p[2]));
      }
    });
    this.cx = (minX + maxX) / 2;
    this.cy = maxY / 2;
    const ext = Math.max(maxX - minX, zr * 2);
    this.sc = Math.min(this.h * 0.85 / (maxY + 0.22), this.w * 0.88 / (ext + 0.3));
    this.chairY = null;
    if (this.chair) {
      const P = (this.A.Lh >= this.B.Lh) ? this.A : this.B;
      this.chairY = fk(P).pel[1] - 0.05;
    }
  }
  loop(now) {
    if (!this.c.isConnected) { this.ro.disconnect(); return; }
    const dt = (now - this.last) / 1000;
    this.last = now;
    if (this.playing && this.modePose === "anim") this.tt += dt * this.speedMul;
    if (this.auto && !this.drag) this.yaw += dt * 20;
    this.draw();
    requestAnimationFrame(this.loop);
  }
  poseAndPhase() {
    if (this.modePose === "init") return { pose: this.A, phase: "Posición Inicial" };
    if (this.modePose === "final") return { pose: this.B, phase: "Posición Final" };
    if (this.hold) {
      const o = lerpPose(this.A, this.A, 0);
      o.t += Math.sin(this.tt * 1.6) * 0.8;
      return { pose: o, phase: "Fase Isométrica (Sostenida)" };
    }
    const cycle = (this.tt * this.spd) % 1;
    const k = (1 - Math.cos(cycle * Math.PI * 2)) / 2;
    let phase = "Fase Concéntrica";
    if (cycle < 0.08 || cycle > 0.92) phase = "Posición Inicial";
    else if (cycle > 0.42 && cycle < 0.58) phase = "Posición Final (Pico)";
    else if (cycle >= 0.58) phase = "Fase Excéntrica (Retorno)";
    return { pose: lerpPose(this.A, this.B, k), phase };
  }
  proj(p) {
    const y = this.yaw * RAD, cp = Math.cos(this.pitch * RAD), sp = Math.sin(this.pitch * RAD);
    const px = p[0] - (this.cx || 0);
    const x1 = px * Math.cos(y) + p[2] * Math.sin(y), z1 = -px * Math.sin(y) + p[2] * Math.cos(y);
    const yy = p[1] - (this.cy || 0.9);
    const y2 = yy * cp - z1 * sp, z2 = yy * sp + z1 * cp;
    const f = 5, s = f / (f + z2);
    const sc = this.sc || this.h / 2.35;
    return { x: this.w / 2 + x1 * s * sc, y: this.h * 0.52 - y2 * s * sc, z: z2, s: s * sc };
  }
  css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  draw() {
    const ctx = this.ctx;
    if (!this.A) return;
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, this.w, this.h);
    const fig = this.css("--fig") || "#7E8CE0", hl = this.css("--hl") || "#FF4D4D", line = this.css("--line") || "#26387A", ink = this.css("--ink") || "#FFF";
    const { pose: P, phase } = this.poseAndPhase();
    const phaseEl = document.getElementById("hud-phase");
    if (phaseEl) phaseEl.textContent = phase;
    const pts = fk(P);
    const c0 = this.proj([0, 0, 0]);
    ctx.save();
    ctx.strokeStyle = line;
    ctx.lineWidth = 1;
    for (let i = -4; i <= 4; i++) {
      const a = this.proj([i * 0.3, 0, -1.2]), b = this.proj([i * 0.3, 0, 1.2]);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.globalAlpha = 0.45; ctx.stroke();
      const a2 = this.proj([-1.2, 0, i * 0.3]), b2 = this.proj([1.2, 0, i * 0.3]);
      ctx.beginPath(); ctx.moveTo(a2.x, a2.y); ctx.lineTo(b2.x, b2.y); ctx.stroke();
    }
    ctx.restore();
    if (this.chair && this.chairY != null) {
      const y = this.chairY;
      const q = [[-0.28, y, -0.28], [0.28, y, -0.28], [0.28, y, 0.28], [-0.28, y, 0.28]].map(p => this.proj([p[0] - 0.06, p[1], p[2]]));
      ctx.save(); ctx.fillStyle = line; ctx.globalAlpha = 0.7;
      ctx.beginPath(); q.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); ctx.fill();
      ctx.restore();
    }
    const list = [];
    SEGS.forEach(([id, a, b, w]) => {
      const A = this.proj(pts[a]), B = this.proj(pts[b]);
      list.push({ id, A, B, w, z: (A.z + B.z) / 2 });
    });
    const H = this.proj(pts.head);
    list.push({ head: true, H, z: H.z });
    list.sort((p, q) => q.z - p.z);
    const TAP = { thighL: [1.25, 0.8], thighR: [1.25, 0.8], shinL: [0.95, 0.6], shinR: [0.95, 0.6], uarmL: [1.1, 0.8], uarmR: [1.1, 0.8], torsoUp: [1.25, 0.9], torsoLow: [0.95, 1.15] };
    const base = parseCol(fig), mus = parseCol(hl);
    list.forEach(it => {
      if (it.head) {
        const r = 0.115 * it.H.s;
        ctx.save();
        const g = ctx.createRadialGradient(it.H.x - r * 0.3, it.H.y - r * 0.3, r * 0.1, it.H.x, it.H.y, r);
        g.addColorStop(0, rgb(mix(base, [255, 255, 255], 0.35)));
        g.addColorStop(1, rgb(mix(base, [0, 0, 0], 0.35)));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(it.H.x, it.H.y, r, 0, 7); ctx.fill();
        ctx.restore();
        return;
      }
      const on = this.hl.has(it.id);
      const tp = TAP[it.id] || [1, 1];
      const ra = Math.max(1.5, it.w * it.A.s * 0.5 * tp[0] * (on ? 1.15 : 1));
      const rb = Math.max(1.5, it.w * it.B.s * 0.5 * tp[1] * (on ? 1.15 : 1));
      const dx = it.B.x - it.A.x, dy = it.B.y - it.A.y, d = Math.hypot(dx, dy) || 1e-3, th = Math.atan2(dy, dx);
      let al = Math.acos(Math.max(-1, Math.min(1, (ra - rb) / d)));
      if (!isFinite(al)) al = Math.PI / 2;
      ctx.save();
      ctx.beginPath();
      ctx.arc(it.A.x, it.A.y, ra, th + al, th + 2 * Math.PI - al);
      ctx.arc(it.B.x, it.B.y, rb, th - al, th + al);
      ctx.closePath();
      if (on) {
        const g = ctx.createLinearGradient(it.A.x, it.A.y, it.B.x, it.B.y);
        const ten = [240, 220, 205];
        g.addColorStop(0, rgb(ten));
        g.addColorStop(0.2, rgb(mus));
        g.addColorStop(0.8, rgb(mus));
        g.addColorStop(1, rgb(ten));
        ctx.fillStyle = g;
      } else {
        ctx.fillStyle = rgb(base);
      }
      ctx.fill();
      ctx.restore();
    });
    ctx.save();
    ctx.fillStyle = ink; ctx.globalAlpha = 0.6;
    ["kneeL", "kneeR", "elbL", "elbR", "hipL", "hipR", "shL", "shR"].forEach(k => {
      if (!pts[k]) return;
      const p = this.proj(pts[k]);
      ctx.beginPath(); ctx.arc(p.x, p.y, 2.4, 0, 7); ctx.fill();
    });
    ctx.restore();
  }
}

function segsOfEx(ex) {
  const s = new Set();
  (ex.mus || []).forEach(m => MUSCLES[m] && MUSCLES[m].seg.forEach(x => s.add(x)));
  return [...s];
}

function handleLogin(e) {
  e.preventDefault();
  S.user.email = document.getElementById("lg_email").value.trim();
  S.loggedIn = true;
  save();
  UI.screen = "home";
  toast("Bienvenido a PhysioMotion 3D");
  render();
}

function handleRegister(e) {
  e.preventDefault();
  const dob = document.getElementById("rg_dob").value;
  const age = dob ? Math.floor((Date.now() - new Date(dob).getTime()) / (365.25 * 86400000)) : 22;
  if (age < 18 && !document.getElementById("rg_minor").checked) {
    toast("Los menores de edad requieren marcar la autorización de padres o tutores.");
    return;
  }
  S.user.name = document.getElementById("rg_name").value.trim();
  S.user.dob = dob;
  S.user.email = document.getElementById("rg_email").value.trim();
  S.user.role = document.getElementById("rg_role").value;
  S.lang = document.getElementById("rg_lang").value;
  S.loggedIn = true;
  save();
  UI.screen = "home";
  toast("Cuenta creada y verificada correctamente");
  render();
}

function renderLibrary() {

  const list = allEx().filter(e => {

      const hay = [exName(e), e.obj, ...(e.mus || []).map(m => MUSCLES[m] ? mName(MUSCLES[m]) : "")].join(" ").toLowerCase();

function setViewerPose(mode) { if (ACTIVE_VIEWER) ACTIVE_VIEWER.modePose = mode; }
function setViewerAngle(yaw) { if (ACTIVE_VIEWER) { ACTIVE_VIEWER.modePose = "anim"; ACTIVE_VIEWER.yaw = yaw; ACTIVE_VIEWER.auto = false; } }
function toggleViewerPlay() { if (ACTIVE_VIEWER) { ACTIVE_VIEWER.modePose = "anim"; ACTIVE_VIEWER.playing = !ACTIVE_VIEWER.playing; } }
function toggleViewerSpin() { if (ACTIVE_VIEWER) ACTIVE_VIEWER.auto = !ACTIVE_VIEWER.auto; }

async function handleVideoUpload(ev, exId) {
  const f = ev.target.files[0];
  if (!f) return;
  await saveVideoRecord({ id: "v_" + Date.now(), ex: exId, title: f.name, blob: f, date: new Date().toLocaleDateString() });
  toast("Video guardado en este dispositivo");
  loadVideoList(exId);
}

async function loadVideoList(exId) {
  const box = document.getElementById("vid_list");
  if (!box) return;
  const vids = await getVideosByEx(exId);
  if (!vids.length) {
    box.innerHTML = `<p class="small muted">No hay videos guardados todavía para este ejercicio.</p>`;
    return;
  }
  box.innerHTML = vids.map(v => {
    const url = URL.createObjectURL(v.blob);
    return `<div class="card flat"><video src="${url}" controls playsinline style="width:100%;border-radius:10px;max-height:240px;background:#000"></video><div class="row spread" style="margin-top:6px"><b class="small">${esc(v.title)}</b><button class="btn danger sm" onclick="removeVideo('${v.id}','${exId}')">Eliminar</button></div></div>`;
  }).join("");
}

async function removeVideo(id, exId) {
  await deleteVideoRecord(id);
  loadVideoList(exId);
}

/* ===== PASO 10 DEL PPT: EJECUTAR MI RUTINA (CON MODELO 3D, CONTADOR 08 REPS Y TEMPORIZADOR 60S) ===== */
let execInterval = null;
function startRoutineSession(rId) {
  const r = PRESET_ROUTINES.find(x => x.id === rId) || PRESET_ROUTINES[0];
  UI.exec = {
    routine: r,
    idx: 0,
    set: 1,
    repsLeft: r.items[0].unit === "s" ? r.items[0].hold : r.items[0].reps,
    resting: false,
    restLeft: r.items[0].rest,
    restTotal: r.items[0].rest,
    startedAt: Date.now()
  };
  clearInterval(execInterval);
  execInterval = setInterval(tickExecSession, 1000);
  navigate("execRoutine");
}

function tickExecSession() {
  if (UI.screen !== "execRoutine" || !UI.exec) return;
  const exState = UI.exec;
  const item = exState.routine.items[exState.idx];
  if (exState.resting) {
    exState.restLeft = Math.max(0, exState.restLeft - 1);
    const rEl = document.getElementById("exec_rest_val");
    const ringEl = document.getElementById("exec_ring");
    if (rEl) rEl.textContent = exState.restLeft + "s";
    if (ringEl) ringEl.style.setProperty("--p", Math.round(100 * (1 - exState.restLeft / (exState.restTotal || 60))));
    if (exState.restLeft === 0) {
      beep(980, 0.25);
      exState.resting = false;
      render();
    }
  } else if (item.unit === "s" && exState.repsLeft > 0) {
    exState.repsLeft = Math.max(0, exState.repsLeft - 1);
    const cEl = document.getElementById("exec_rep_val");
    if (cEl) cEl.textContent = String(exState.repsLeft).padStart(2, "0");
    if (exState.repsLeft === 0) beep(880, 0.2);
  }
}

function renderExecRoutine() {
  const st = UI.exec;
  if (!st) return `<div class="card">No hay sesión activa.</div>`;
  const item = st.routine.items[st.idx];
  const ex = getEx(item.ex);
  return `
    <div class="card neon">
      <div class="row spread">
        <span class="tag teal">EJECUCIÓN EN CURSO (PASO 10)</span>
        <span class="small muted">Ejercicio ${st.idx + 1} de ${st.routine.items.length}</span>
      </div>
      <h2 style="margin-top:6px">${esc(exName(ex))}</h2>
      <p class="small muted">Serie ${st.set} de ${item.sets} · ${esc(item.note)}</p>
    </div>

    <div class="stage">
      <div class="hud-top"><span class="badge3d" id="hud-phase">Demostración 3D</span></div>
      <canvas id="exec3d" style="height:230px"></canvas>
    </div>

    ${st.resting ? `
      <div class="card" style="text-align:center">
        <h3>Tiempo de Descanso</h3>
        <div class="ring" id="exec_ring" style="margin:12px auto;--p:0">
          <div>
            <b id="exec_rest_val">${st.restLeft}s</b>
            <span class="small muted">Descanso</span>
          </div>
        </div>
        <button class="btn sm alt" onclick="UI.exec.resting=false;render()">Saltar descanso</button>
      </div>
    ` : `
      <div class="card" style="text-align:center">
        <div class="ring" style="--p:${Math.round((st.set / item.sets) * 100)};margin:6px auto">
          <div>
            <b id="exec_rep_val">${String(st.repsLeft).padStart(2, "0")}</b>
            <span class="small muted">${item.unit === "s" ? "SEGUNDOS" : "REPS"}</span>
          </div>
        </div>
        <p class="small muted" style="margin-top:8px">Descanso programado: <b>${item.rest}s</b></p>
        <div class="row" style="justify-content:center;margin-top:10px">
          ${item.unit !== "s" ? `<button class="btn sm ghost" onclick="if(UI.exec.repsLeft>0)UI.exec.repsLeft--;render()">-1 Rep</button>` : ""}
          <button class="btn teal" onclick="completeExecSet()">✓ Completar serie ${st.set}/${item.sets}</button>
        </div>
      </div>
    `}

    <div class="row wrap">
      <button class="btn purple block" onclick="nextExecExercise()">${t("nextEx").toUpperCase()} ➔</button>
      <button class="btn ghost block" onclick="finishExecToLog()">Finalizar y Registrar Actividad (Paso 11)</button>
    </div>
  `;
}

function completeExecSet() {
  const st = UI.exec;
  const item = st.routine.items[st.idx];
  beep(740, 0.12);
  if (st.set < item.sets) {
    st.set++;
    st.repsLeft = item.unit === "s" ? item.hold : item.reps;
    st.resting = true;
    st.restLeft = item.rest;
    st.restTotal = item.rest;
    render();
  } else {
    nextExecExercise();
  }
}

function nextExecExercise() {
  const st = UI.exec;
  if (st.idx < st.routine.items.length - 1) {
    st.idx++;
    const nextItem = st.routine.items[st.idx];
    st.set = 1;
    st.repsLeft = nextItem.unit === "s" ? nextItem.hold : nextItem.reps;
    st.resting = false;
    render();
  } else {
    finishExecToLog();
  }
}

function finishExecToLog() {
  clearInterval(execInterval);
  navigate("logActivity");
}

function loadScanImage(ev) {

function processBiometricScan(e) {
  e.preventDefault();
  const sc = UI.scan;
  sc.age = +document.getElementById("sc_age").value || 22;
  sc.gender = document.getElementById("sc_gender").value;
  sc.height = +document.getElementById("sc_height").value || 165;
  sc.weight = +document.getElementById("sc_weight").value || 65;
  sc.activity = document.getElementById("sc_act").value;
  sc.postureHabit = document.getElementById("sc_habit").value;
  sc.zone = document.getElementById("sc_zone").value;
  sc.side = document.getElementById("sc_side").value;
  sc.stiffness = +document.getElementById("sc_stiff").value || 0;

  // Cálculo de IMC y reducciones funcionales por rigidez/edad/sedentarismo
  const hMeters = sc.height / 100;
  const bmi = +(sc.weight / (hMeters * hMeters)).toFixed(1);
  const bmiLabel = bmi < 18.5 ? "Bajo peso" : bmi < 25 ? "Normopeso" : bmi < 30 ? "Sobrepeso ligero" : "Sobrecarga ponderal";
  const penalty = Math.round(sc.stiffness * 2.2 + (sc.age > 50 ? 6 : 0) + (sc.activity === "Sedentario" ? 5 : 0));

  // Evaluación Postural según hábitos y datos
  const tiltShoulder = (1.2 + sc.stiffness * 0.35 + (sc.side !== "Bilateral" ? 0.8 : 0)).toFixed(1);
  const tiltPelvis = (1.0 + sc.stiffness * 0.25).toFixed(1);

  const frontalText = `Inclinación escapular estimada de ${tiltShoulder}° y báscula pélvica de ${tiltPelvis}° (${tiltShoulder > 3 ? "leve asimetría funcional hacia el lado " + sc.side.toLowerCase() : "dentro de parámetros funcionales"}). Alineación de ejes de miembros inferiores conservada.`;

  const sagittalMap = {
    sentado: "Tendencia a la antepulsión cefálica (+2.5 cm), protracción escapular y acortamiento de flexores de cadera (psoas e isquiotibiales) por sedestación prolongada.",
    pie: "Tendencia a la anteversión pélvica e hiperlordosis lumbar compensatoria con sobrecarga en tríceps sural y fascia plantar.",
    carga: "Aumento de tensión en erectores espinales y requerimiento de estabilización del core profundo (transverso abdominal) ante esfuerzos axiales.",
    alternado: "Curvaturas fisiológicas cervical, dorsal y lumbar equilibradas con adecuada distribución del centro de gravedad."
  };
  const sagittalText = sagittalMap[sc.postureHabit] || sagittalMap.alternado;

  const loadText = `Con estatura de ${sc.height} cm y peso de ${sc.weight} kg (IMC ${bmi}), la carga mecánica sobre ${sc.zone.toLowerCase()} es ${bmi < 25 ? "óptima y sin sobrecarga axial adicional" : "moderada; se sugiere priorizar control excéntrico y fortalecimiento de estabilizadores"}.`;

  // Tabla Goniométrica según la articulación seleccionada
  const baseRom = {
    Rodilla: [
      { mov: "Flexión de rodilla", base: 135, norm: "0° - 135°" },
      { mov: "Extensión activa", base: 0, norm: "0° (Completa)", isZero: true },
      { mov: "Rotación tibial interna", base: 28, norm: "0° - 30°" }
    ],
    Hombro: [
      { mov: "Flexión anterior", base: 178, norm: "0° - 180°" },
      { mov: "Abducción glenohumeral", base: 175, norm: "0° - 180°" },
      { mov: "Rotación externa (a 90°)", base: 85, norm: "0° - 90°" }
    ],
    Cadera: [
      { mov: "Flexión coxofemoral", base: 120, norm: "0° - 120°" },
      { mov: "Abducción de cadera", base: 42, norm: "0° - 45°" },
      { mov: "Extensión activa", base: 28, norm: "0° - 30°" }
    ],
    Tobillo: [
      { mov: "Dorsiflexión (Flexión dorsal)", base: 20, norm: "0° - 20°" },
      { mov: "Flexión plantar", base: 48, norm: "0° - 50°" },
      { mov: "Inversión subtalar", base: 32, norm: "0° - 35°" }
    ],
    Columna: [
      { mov: "Flexión dorso-lumbar", base: 80, norm: "0° - 80°" },
      { mov: "Extensión raquídea", base: 28, norm: "0° - 30°" },
      { mov: "Inclinación lateral", base: 35, norm: "0° - 35°" }
    ]
  }[sc.zone];

  const goniometry = baseRom.map(item => {
    if (item.isZero) {
      const deficit = sc.stiffness >= 5 ? -3 : 0;
      return { mov: item.mov, val: deficit, norm: item.norm, ok: deficit === 0, status: deficit === 0 ? "Funcional" : "Leve limitación" };
    }
    const loss = Math.round((item.base * penalty) / 100);
    const val = Math.max(10, item.base - loss);
    const ok = loss <= item.base * 0.12;
    return {
      mov: item.mov,
      val,
      norm: item.norm,
      ok,
      status: ok ? "Óptimo" : "Reducido (-" + loss + "°)"
    };
  });

  const postureScore = Math.max(55, 96 - penalty * 2);
  const romPct = Math.max(60, 100 - penalty);

  const recMap = {
    Rodilla: "Se recomienda la rutina de Sentadilla a silla (3D) con descenso controlado en 3 segundos y fortalecimiento isométrico de cuádriceps (Wall Sit).",
    Hombro: "Se recomienda la Rutina de Hombro (Elevación frontal, Abducción lateral hasta 90° y Remo escapular con banda) cuidando no encoger el trapecio.",
    Cadera: "Se recomienda la Rutina de Cadera y Pelvis (Puente de glúteos y Abducción de pie) para estabilizar el glúteo medio.",
    Tobillo: "Se recomienda el Programa Asignado de Rehabilitación de Tobillo (Elevación de talones, Descenso excéntrico y Equilibrio monopodal).",
    Columna: "Se recomienda Movilidad torácica y escapular combinada con Respiración diafragmática guiada y Plancha isométrica."
  };

  sc.result = {
    bmi,
    bmiLabel,
    postureScore,
    romPct,
    frontalText,
    sagittalText,
    loadText,
    goniometry,
    recommendation: recMap[sc.zone]
  };

  sc.step = 3;
  render();
  window.scrollTo(0, 0);
}

function saveBiometricScan() {
  const sc = UI.scan;
  if (!sc.result) return;
  const summary = `Zona: ${sc.zone} (${sc.side}) | ${sc.age} años, ${sc.gender}, IMC ${sc.result.bmi} | Alineación: ${sc.result.postureScore}/100 | Goniometría: ${sc.result.goniometry.map(g => g.mov + " " + g.val + "°").join(", ")}.`;
  S.scans.push({
    t: Date.now(),
    zone: sc.zone + " (" + sc.side + ")",
    text: summary
  });
  save();
  toast("Evaluación postural y goniométrica guardada en el historial");
}

let wtInterval = null;
function toggleWatchTimer() {
  UI.timer.run = !UI.timer.run;
  clearInterval(wtInterval);
  if (UI.timer.run) {
    wtInterval = setInterval(() => {
      if (!UI.timer.run) return;
      UI.timer.rem = Math.max(0, UI.timer.rem - 1);
      const el = document.getElementById("wt_rem");
      if (el) el.textContent = UI.timer.rem + "s";
      if (UI.timer.rem === 0) {
        beep(960, 0.25);
        UI.timer.round = (UI.timer.round % UI.timer.rounds) + 1;
        UI.timer.rem = UI.timer.work;
        render();
      }
    }, 1000);
  }
  render();
}

      <p class="small muted" style="margin-top:4px"><b>Enfoque:</b> ${esc(r.innov)}</p>
    </div>
    <div class="list">
      ${r.items.map(id => {
        const e = getEx(id);
        return `<button class="item" onclick="navigate('exDetail','${e.id}')"><span class="ico">${ic("dumbbell")}</span><span class="grow"><span class="nm">${esc(exName(e))}</span><br><span class="small muted">${esc(e.obj)}</span></span></button>`;
      }).join("")}
    </div>
  `;
}

/* ===== CICLO DE IDIOMA, TEMA Y HOOKS POST-RENDER ===== */
function cycleLang() {
  const order = ["es", "en", "de"];
  S.lang = order[(order.indexOf(S.lang) + 1) % 3];
  save();
  render();
}

function toggleTheme() {
  S.theme = S.theme === "dark" ? "light" : "dark";
  save();
  render();
}

function afterRender() {
  const authCv = document.getElementById("auth3d");
  if (authCv) {
    ACTIVE_VIEWER = new Viewer3D(authCv, { yaw: 35, auto: true });
    ACTIVE_VIEWER.setExercise(getEx("sts"), ["quad", "glutmax"].flatMap(m => MUSCLES[m].seg));
  }
  const exCv = document.getElementById("ex3d");
  if (exCv) {
    const e = getEx(UI.param);
    ACTIVE_VIEWER = new Viewer3D(exCv, { yaw: 35, auto: true });
    ACTIVE_VIEWER.setExercise(e, segsOfEx(e));
    if (UI.exTab === "videos") loadVideoList(e.id);
  }
  const execCv = document.getElementById("exec3d");
  if (execCv && UI.exec) {
    const e = getEx(UI.exec.routine.items[UI.exec.idx].ex);
    ACTIVE_VIEWER = new Viewer3D(execCv, { yaw: 35, auto: false });
    ACTIVE_VIEWER.setExercise(e, segsOfEx(e));
  }
  const anatCv = document.getElementById("anat3d");
  if (anatCv) {
    const segs = Object.values(MUSCLES).filter(m => UI.mreg === "all" || m.reg === UI.mreg).flatMap(m => m.seg);
    ACTIVE_VIEWER = new Viewer3D(anatCv, { yaw: 35, auto: true });
    ACTIVE_VIEWER.setExercise({ pose: { A: {}, B: {}, hold: 1 } }, UI.mreg === "all" ? ["thighL", "thighR", "torsoLow"] : segs);
  }
  const scanCv = document.getElementById("scan_cv");
  if (scanCv && UI.scan.imgEl) {
    const w = scanCv.parentElement.clientWidth || 320;
    const im = UI.scan.imgEl;
    const h = Math.round(w * im.naturalHeight / im.naturalWidth);
    scanCv.width = w; scanCv.height = h;
    const ctx = scanCv.getContext("2d");
    ctx.drawImage(im, 0, 0, w, h);
    ctx.strokeStyle = "#00E5FF"; ctx.lineWidth = 3; ctx.fillStyle = "#FF4D4D";
    const P = UI.scan.pts.map(p => ({ x: p.x * w, y: p.y * h }));
    if (P.length > 1) {
      ctx.beginPath(); P.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
    }
    P.forEach(p => { ctx.beginPath(); ctx.arc(p.x, p.y, 6, 0, 7); ctx.fill(); });
  }
}

window.addEventListener("DOMContentLoaded", () => render());
  </script>
